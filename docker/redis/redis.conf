# Local development Redis. Not for production.

# Inside the container the whole network namespace is ours; the host port is
# already restricted to 127.0.0.1 in docker-compose.yml.
bind 0.0.0.0
protected-mode no
port 6379

# Pub/Sub does not store anything. Persistence only matters once we also use
# Redis as a cache or queue; AOF keeps that data across container restarts.
dir /data
appendonly yes
appendfsync everysec

# Dev safety net: cap memory and evict least-recently-used keys.
maxmemory 128mb
maxmemory-policy allkeys-lru
