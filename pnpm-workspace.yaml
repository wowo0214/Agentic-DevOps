packages:
  - "apps/*"
  - "packages/*"
verifyDepsBeforeRun: false
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
  sharp: false
  workerd: false

overrides:
  typescript: "^7.0.2"
patchedDependencies:
  next@16.4.0: patches/next@16.4.0.patch
minimumReleaseAgeExclude:
  - "@ai-sdk/deepseek@3.0.66"
  - "@ai-sdk/gateway@4.0.115"
  - "@ai-sdk/provider-utils@5.0.61"
  - "@ai-sdk/provider@4.0.28"
  - "@e2e-dev/web@0.15.1"
  - ai@7.0.142
  - e2e@0.21.1
